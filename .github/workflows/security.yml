name: Security Regression

on:
  push:
    branches: [main]
  pull_request:

jobs:
  security:
    name: RBAC + tenant isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx prisma generate

      - name: Verify DATABASE_URL shape
        shell: bash
        run: |
          if [[ -z "$DATABASE_URL" ]]; then
            echo "DATABASE_URL is EMPTY (CI_DATABASE_URL secret not set)"
            exit 1
          elif [[ "$DATABASE_URL" == postgresql://* ]]; then
            echo "DATABASE_URL OK (postgresql://, length ${#DATABASE_URL})"
          elif [[ "$DATABASE_URL" == postgres://* ]]; then
            echo "DATABASE_URL OK (postgres://, length ${#DATABASE_URL})"
          else
            echo "DATABASE_URL INVALID (length ${#DATABASE_URL}, prefix '${DATABASE_URL:0:13}')"
            exit 1
          fi
        env:
          DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}

      - name: Run security regression suite
        run: npm run test:security
        env:
          DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
